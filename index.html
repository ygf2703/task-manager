<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מנהל המשימות שלי</title>
  <style>
    :root { --navy:#071c3b; --blue:#0d356b; --panel:#102c56; --yellow:#ffd447; --white:#fff; --muted:#c6d4e8; --focus:#8fd3ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--white); background:linear-gradient(145deg,var(--navy),#0b2b57); font-family:Arial,"Assistant",sans-serif; }
    main { width:min(100% - 32px,720px); margin:0 auto; padding:36px 0 48px; }
    h1 { margin:0 0 8px; color:var(--yellow); font-size:clamp(1.8rem,5vw,2.5rem); }
    .intro { margin:0 0 26px; color:var(--muted); }
    .card { padding:20px; margin-bottom:18px; background:rgba(16,44,86,.94); border:1px solid rgba(255,212,71,.38); border-radius:14px; box-shadow:0 12px 28px rgba(0,0,0,.18); }
    label { display:block; margin-bottom:8px; font-weight:700; }
    input { width:100%; min-height:45px; padding:10px 12px; border:2px solid transparent; border-radius:8px; color:#071c3b; background:var(--white); font:inherit; }
    input:focus, button:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .task-form { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
    .field { min-width:0; }
    button { min-height:44px; padding:10px 16px; cursor:pointer; border:2px solid var(--yellow); border-radius:8px; color:#071c3b; background:var(--yellow); font:inherit; font-weight:700; }
    button:hover { background:#ffe27b; }
    .message { min-height:24px; margin:12px 0 0; color:#fff1ad; font-weight:700; }
    .message[hidden] { display:none; }
    .toolbar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .counter { margin:0; color:var(--muted); }
    .filters { display:flex; gap:7px; flex-wrap:wrap; }
    .filter { min-height:36px; padding:6px 11px; color:var(--white); background:transparent; border-color:var(--muted); }
    .filter[aria-pressed="true"] { color:#071c3b; background:var(--yellow); border-color:var(--yellow); }
    .tasks { padding:0; margin:16px 0 0; list-style:none; display:grid; gap:10px; }
    .task { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid rgba(198,212,232,.45); border-radius:10px; background:rgba(7,28,59,.46); }
    .task input[type="checkbox"] { width:22px; min-width:22px; min-height:22px; margin:2px 0 0; accent-color:var(--yellow); }
    .task-content { flex:1; min-width:0; }
    .task-title { display:block; overflow-wrap:anywhere; font-weight:700; }
    .task-meta { display:block; margin-top:5px; color:var(--muted); font-size:.9rem; }
    .task.completed .task-title { color:var(--muted); text-decoration:line-through; }
    .delete { min-height:36px; padding:6px 10px; flex-shrink:0; color:var(--white); border-color:var(--muted); background:transparent; }
    .delete:hover { color:#071c3b; background:var(--yellow); border-color:var(--yellow); }
    .empty { margin:16px 0 0; padding:30px 16px; text-align:center; color:var(--muted); border:1px dashed var(--muted); border-radius:10px; }
    @media (max-width:600px) { main { width:min(100% - 24px,720px); padding-top:24px; } .card { padding:16px; } .task-form { grid-template-columns:1fr; } .task-form button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <h1>מנהל המשימות שלי</h1>
    <p class="intro">ניהול אישי ופשוט של המשימות החשובות לך.</p>
    <section class="card" aria-labelledby="user-heading">
      <label id="user-heading" for="user-name">שם המשתמש</label>
      <input id="user-name" type="text" maxlength="60" autocomplete="name" placeholder="לדוגמה: נעם">
    </section>
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">משימה חדשה</h2>
      <form id="task-form" novalidate>
        <div class="field"><label for="task-input">תיאור המשימה</label><input id="task-input" type="text" maxlength="200" autocomplete="off" placeholder="מה צריך לעשות?" required></div>
        <div class="field"><label for="owner-input">בעלים</label><input id="owner-input" type="text" maxlength="60" autocomplete="off" placeholder="ברירת מחדל: שם המשתמש"></div>
        <button type="submit">הוספת משימה</button>
      </form>
      <p id="form-message" class="message" role="alert" hidden></p>
    </section>
    <section class="card" aria-labelledby="list-heading">
      <div class="toolbar"><h2 id="list-heading">המשימות</h2><p id="counter" class="counter" aria-live="polite"></p><div class="filters" aria-label="סינון משימות"><button class="filter" type="button" data-filter="all" aria-pressed="true">הכול</button><button class="filter" type="button" data-filter="open" aria-pressed="false">פתוחות</button><button class="filter" type="button" data-filter="completed" aria-pressed="false">הושלמו</button></div></div>
      <ul id="task-list" class="tasks" aria-live="polite"></ul>
      <p id="empty-state" class="empty">אין משימות להצגה. אפשר להתחיל בהוספת משימה חדשה.</p>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const storageKeys = { tasks: 'personal-task-manager-tasks', user: 'personal-task-manager-user' };
      const form = document.querySelector('#task-form'); const taskInput = document.querySelector('#task-input'); const ownerInput = document.querySelector('#owner-input'); const userName = document.querySelector('#user-name'); const message = document.querySelector('#form-message'); const taskList = document.querySelector('#task-list'); const emptyState = document.querySelector('#empty-state'); const counter = document.querySelector('#counter'); const filterButtons = document.querySelectorAll('.filter');
      let filter = 'all'; let tasks = loadTasks();
      function loadTasks() { try { const saved = JSON.parse(localStorage.getItem(storageKeys.tasks) || '[]'); return Array.isArray(saved) ? saved.filter(isValidTask) : []; } catch { return []; } }
      function isValidTask(task) { return task && typeof task.id === 'string' && typeof task.text === 'string' && typeof task.owner === 'string' && typeof task.completed === 'boolean'; }
      function saveTasks() { localStorage.setItem(storageKeys.tasks, JSON.stringify(tasks)); }
      function showMessage(text) { message.textContent = text; message.hidden = false; }
      function clearMessage() { message.textContent = ''; message.hidden = true; }
      function newId() { return `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function filteredTasks() { return tasks.filter(task => filter === 'all' || (filter === 'open' ? !task.completed : task.completed)); }
      function render() { const visibleTasks = filteredTasks(); taskList.replaceChildren(); visibleTasks.forEach(task => taskList.appendChild(createTaskElement(task))); emptyState.hidden = visibleTasks.length > 0; const openCount = tasks.filter(task => !task.completed).length; counter.textContent = openCount === 1 ? 'משימה פתוחה אחת' : `${openCount} משימות פתוחות`; }
      function createTaskElement(task) {
        const item = document.createElement('li'); item.className = `task${task.completed ? ' completed' : ''}`;
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completed; checkbox.setAttribute('aria-label', `סימון המשימה ${task.text} כהושלמה`); checkbox.addEventListener('change', () => { task.completed = checkbox.checked; saveTasks(); render(); });
        const content = document.createElement('div'); content.className = 'task-content'; const title = document.createElement('span'); title.className = 'task-title'; title.textContent = task.text; const meta = document.createElement('span'); meta.className = 'task-meta'; meta.textContent = `בעלים: ${task.owner}`; content.append(title, meta);
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'delete'; remove.textContent = 'מחיקה'; remove.setAttribute('aria-label', `מחיקת המשימה ${task.text}`); remove.addEventListener('click', () => { tasks = tasks.filter(current => current.id !== task.id); saveTasks(); render(); }); item.append(checkbox, content, remove); return item;
      }
      form.addEventListener('submit', event => { event.preventDefault(); const text = taskInput.value.trim(); const owner = ownerInput.value.trim() || userName.value.trim(); if (!text) { showMessage('יש להזין תיאור למשימה לפני ההוספה.'); taskInput.focus(); return; } if (!owner) { showMessage('יש להזין בעלים למשימה או להגדיר שם משתמש.'); ownerInput.focus(); return; } tasks.unshift({ id: newId(), text, owner, completed: false }); saveTasks(); taskInput.value = ''; ownerInput.value = ''; clearMessage(); render(); taskInput.focus(); });
      userName.value = localStorage.getItem(storageKeys.user) || ''; userName.addEventListener('input', () => localStorage.setItem(storageKeys.user, userName.value.trim()));
      filterButtons.forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; filterButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button))); render(); }));
      render();
    })();
  </script>
</body>
</html>
